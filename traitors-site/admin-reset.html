<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traitors Admin Reset</title>
<style>
:root{--bg:#05070a;--panel:#0b1118;--line:#293747;--text:#eef6ff;--muted:#8798a8;--gold:#d6aa4b;--red:#ff405c;--green:#54e393}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1710,#05070a 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(460px,100%)}.brand{text-align:center;margin-bottom:18px}.brand h1{letter-spacing:4px;margin:7px 0;font-size:28px}.brand p{color:var(--muted);font-size:12px}.card{background:linear-gradient(180deg,#0d1319,#080c10);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 70px #0009}label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #283848;background:#071019;color:#fff;font:inherit}button{width:100%;margin-top:16px;padding:14px;border-radius:10px;border:1px solid #8a6c2d;background:#352a13;color:#ffe6a2;font-weight:900;cursor:pointer}.msg{margin-top:14px;text-align:center;font-size:13px;line-height:1.5}.err{color:#ff8595}.ok{color:var(--green)}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}.email{padding:11px;border:1px solid #263341;border-radius:9px;background:#070c11;font-weight:800}.hidden{display:none}</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div style="font-size:48px">◉</div><h1>ADMIN RESET</h1><p>TRAITORS // ONE-TIME RECOVERY</p></div>
  <div class="card">
    <label>ADMIN EMAIL</label><div class="email">owaispub22@gmail.com</div>
    <label>ONE-TIME RESET CODE</label><input id="code" autocomplete="off" placeholder="Enter reset code">
    <label>NEW PASSWORD</label><input id="password" type="password" autocomplete="new-password" placeholder="Minimum 10 characters">
    <label>CONFIRM NEW PASSWORD</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat new password">
    <button id="resetBtn">SET NEW ADMIN PASSWORD</button>
    <div id="msg" class="msg"></div>
    <div class="note">This recovery works once only. After a successful reset, the same reset code cannot be used again.</div>
  </div>
</div>
<script>
const BASE='https://hqzsmfeckjoxhoktpdyy.supabase.co';
const KEY='sb_publishable_NPBxELB7s_5Mt4pB-aBflw_UgL80P-b';
const ADMIN='owaispub22@gmail.com';
const btn=document.getElementById('resetBtn'),msg=document.getElementById('msg');
function show(t,ok=false){msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
btn.onclick=async()=>{
  const code=document.getElementById('code').value.trim();
  const pw=document.getElementById('password').value;
  const cf=document.getElementById('confirm').value;
  if(!code)return show('Enter the one-time reset code.');
  if(pw.length<10)return show('Password must be at least 10 characters.');
  if(pw!==cf)return show('Passwords do not match.');
  btn.disabled=true;show('Resetting password…',true);
  try{
    const r=await fetch(BASE+'/functions/v1/admin-reset-v1',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:ADMIN,reset_code:code,new_password:pw})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Reset failed');
    show('Password changed successfully. You can now open Admin Control and log in.',true);
    btn.textContent='PASSWORD RESET COMPLETE';btn.disabled=true;
  }catch(e){show(e.message||'Reset failed');btn.disabled=false;}
};
</script>
</body>
</html>
