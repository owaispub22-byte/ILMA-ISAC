<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Traitors Admin</title><style>
:root{--bg:#07090c;--panel:#0e141b;--line:#283444;--text:#f2f6fb;--muted:#8594a4;--gold:#d9ab4a;--red:#ff3653;--green:#3ddc84;--blue:#4b8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b21,#07090c 42%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.shell{max-width:1150px;margin:auto;padding:18px}.hidden{display:none!important}.brand{text-align:center;padding:36px 10px 18px}.brand h1{letter-spacing:4px;margin:0}.brand p{color:var(--muted);font-size:12px;letter-spacing:2px}.card{background:linear-gradient(180deg,#111820,#0a0f14);border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}.login{max-width:430px;margin:20px auto}input,button{font:inherit}input{width:100%;background:#080d12;color:#fff;border:1px solid #2b3947;border-radius:10px;padding:13px;margin:7px 0}button{border:1px solid #354455;background:#121b24;color:#fff;border-radius:9px;padding:10px 12px;font-weight:800;cursor:pointer}button:hover{border-color:var(--gold)}.primary{width:100%;background:#2f2510;border-color:#8a6b28;color:#ffe09a}.danger{border-color:#7e2634;background:#2f0d14;color:#ff9bab}.blue{border-color:#315d94}.green{border-color:#2c7b51}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top .grow{flex:1}.badge{border:1px solid #6a5527;color:#efc969;border-radius:999px;padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.buttons button{flex:1 1 120px}.sectionTitle{font-size:13px;color:#d9e2ec;letter-spacing:2px;margin:0 0 9px}.status{color:var(--muted);font-size:12px}.players{overflow:auto}.row{display:grid;grid-template-columns:minmax(170px,1.4fr) 100px 80px minmax(300px,2fr);gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid #1a232d}.row.head{font-size:11px;color:var(--muted);font-weight:800}.name b{display:block}.name small{color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:6px 8px;font-size:10px}.traitor{color:#ff7487}.innocent{color:#6fa7ff}.search{max-width:320px}.msg{padding:9px;text-align:center;font-size:12px}.err{color:#ff8495}.ok{color:#7cf0ad}@media(max-width:720px){.row{grid-template-columns:1fr 80px}.row .shield,.row .actions{grid-column:1/-1}.row.head{display:none}}
</style></head><body><div class="shell">
<section id="loginView"><div class="brand"><h1>TRAITORS // ADMIN</h1><p>PRIVATE CONTROL CONSOLE</p></div><div class="card login"><div class="status">Admin email</div><input id="email" value="owaispub22@gmail.com" readonly><input id="password" type="password" placeholder="Admin password"><button id="loginBtn" class="primary">ENTER ADMIN CONTROL</button><div id="loginMsg" class="msg"></div></div></section>
<section id="adminView" class="hidden"><div class="card top"><div class="grow"><b>TRAITORS // ADMIN CONTROL</b><div class="status">Signed in as <span id="adminEmail"></span></div></div><span id="phaseBadge" class="badge">LOBBY</span><button id="refreshBtn">REFRESH</button><button id="logoutBtn">LOGOUT</button></div>
<div class="grid">
<div class="card"><h3 class="sectionTitle">GAME PHASE</h3><div class="buttons"><button data-phase="lobby">LOBBY</button><button data-phase="traitor_discussion">BLACK ROOM</button><button data-phase="traitor_vote" class="danger">MURDER VOTE</button><button data-phase="circle_of_doubt" class="danger">CIRCLE OF DOUBT</button><button data-phase="paused">PAUSE</button><button data-phase="finished">END GAME</button></div></div>
<div class="card"><h3 class="sectionTitle">SUSPENSE VOTE REVEAL</h3><div class="buttons"><button id="startReveal">START REVEAL</button><button id="callNext">CALL NEXT VOTER</button><button id="showTally">LIVE TALLY</button></div><div id="tally" class="status"></div></div>
<div class="card"><h3 class="sectionTitle">TIMERS</h3><div class="buttons"><button data-min="5">5 MIN</button><button data-min="10">10 MIN</button><button data-min="15">15 MIN</button><button data-min="30">30 MIN</button></div></div>
</div>
<div class="card"><div class="top"><div class="grow"><h3 class="sectionTitle">PLAYERS & SECRET ROLES</h3><div class="status">Only this Admin panel can view the real Traitor map.</div></div><input id="search" class="search" placeholder="Search name or Student ID"></div><div id="adminMsg" class="msg"></div><div class="players"><div class="row head"><div>PLAYER</div><div>ROLE</div><div>SHIELDS</div><div>ACTIONS</div></div><div id="players"></div></div></div>
</section></div><script>
'use strict';const BASE='https://hqzsmfeckjoxhoktpdyy.supabase.co';const KEY='sb_publishable_NPBxELB7s_5Mt4pB-aBflw_UgL80P-b';const STORE='traitors_admin_session_v1';const $=x=>document.getElementById(x);let session=null,snapshot=null,roleMap=[];
function save(s){session=s;localStorage.setItem(STORE,JSON.stringify(s))}function load(){try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{session=null}return session}function clear(){session=null;localStorage.removeItem(STORE)}
async function parse(r){const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok){const e=new Error((d&&d.message)||(d&&d.msg)||(d&&d.error_description)||(d&&d.error)||('HTTP '+r.status));e.status=r.status;throw e}return d}
async function signIn(){const email=$('email').value.trim(),password=$('password').value;const d=await parse(await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})}));save({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+((d.expires_in||3600)-30)*1000,user:d.user});return d}
async function refreshToken(){const d=await parse(await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({refresh_token:session.refresh_token})}));save({access_token:d.access_token,refresh_token:d.refresh_token||session.refresh_token,expires_at:Date.now()+((d.expires_in||3600)-30)*1000,user:d.user})}
async function token(){if(!session)load();if(!session?.access_token)throw new Error('Not signed in');if((session.expires_at||0)<Date.now()+5000)await refreshToken();return session.access_token}
async function rpc(name,args={}){let tk=await token();let r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+tk},body:JSON.stringify(args)});if(r.status===401){await refreshToken();tk=session.access_token;r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+tk},body:JSON.stringify(args)})}return parse(r)}
function msg(t,ok=false){$('adminMsg').className='msg '+(ok?'ok':'err');$('adminMsg').textContent=t||''}
async function boot(){load();if(!session?.access_token)return;try{snapshot=await rpc('control_snapshot');if(snapshot.control_role!=='admin')throw new Error('This account is not an Admin account.');$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');$('adminEmail').textContent=session.user?.email||'owaispub22@gmail.com';await refreshAll()}catch(e){$('loginMsg').textContent=e.message;clear()}}
async function refreshAll(){try{snapshot=await rpc('control_snapshot');roleMap=await rpc('admin_traitor_map');$('phaseBadge').textContent=String(snapshot.phase||'lobby').toUpperCase().replaceAll('_',' ');renderPlayers();msg('Live data refreshed.',true)}catch(e){msg(e.message)}}
function renderPlayers(){const q=$('search').value.trim().toLowerCase();const roleBy=new Map((roleMap||[]).map(r=>[r.member_id,r]));const list=(snapshot.players||[]).filter(p=>!q||String(p.player_name).toLowerCase().includes(q)||String(p.student_id).toLowerCase().includes(q));$('players').innerHTML=list.map(p=>{const r=roleBy.get(p.member_id)||{role:'innocent',traitor_alias:null};const traitor=r.role==='traitor';return `<div class="row"><div class="name"><b>${esc(p.player_name)}</b><small>${esc(p.student_id)} • ${esc(p.status)}</small></div><div class="${traitor?'traitor':'innocent'}"><b>${traitor?'TRAITOR':'INNOCENT'}</b>${traitor&&r.traitor_alias?`<small>${esc(r.traitor_alias)}</small>`:''}</div><div class="shield">🛡 ${p.shields||0}</div><div class="actions"><button class="blue roleBtn" data-id="${p.member_id}" data-role="innocent">INNOCENT</button><button class="danger roleBtn" data-id="${p.member_id}" data-role="traitor">TRAITOR</button><button class="green shieldBtn" data-id="${p.member_id}" data-change="1">+ SHIELD</button><button class="shieldBtn" data-id="${p.member_id}" data-change="-1">- SHIELD</button><button class="danger elimBtn" data-id="${p.member_id}">ELIMINATE</button><button class="revealBtn" data-id="${p.member_id}">REVEAL REQUEST</button></div></div>`}).join('');document.querySelectorAll('.roleBtn').forEach(b=>b.onclick=()=>setRole(b.dataset.id,b.dataset.role));document.querySelectorAll('.shieldBtn').forEach(b=>b.onclick=()=>shield(b.dataset.id,Number(b.dataset.change)));document.querySelectorAll('.elimBtn').forEach(b=>b.onclick=()=>eliminate(b.dataset.id));document.querySelectorAll('.revealBtn').forEach(b=>b.onclick=()=>revealReq(b.dataset.id))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function setRole(id,role){if(!confirm('Set this player as '+role.toUpperCase()+'?'))return;try{await rpc('admin_set_role',{p_member_id:id,p_role:role});await refreshAll()}catch(e){msg(e.message)}}async function shield(id,change){try{await rpc('control_award_shield',{p_member_id:id,p_change:change,p_reason:'Admin control panel'});await refreshAll()}catch(e){msg(e.message)}}async function eliminate(id){if(!confirm('Eliminate this player? Their game access will be locked.'))return;try{await rpc('admin_eliminate_player',{p_member_id:id,p_reason:'Admin elimination'});await refreshAll()}catch(e){msg(e.message)}}async function revealReq(id){try{await rpc('admin_request_identity_reveal',{p_member_id:id});msg('Identity reveal request sent.',true)}catch(e){msg(e.message)}}
$('loginBtn').onclick=async()=>{try{$('loginBtn').disabled=true;$('loginMsg').textContent='Signing in…';await signIn();await boot()}catch(e){$('loginMsg').textContent='Login failed: '+e.message}finally{$('loginBtn').disabled=false}};$('logoutBtn').onclick=async()=>{try{if(session?.access_token)await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+session.access_token}})}catch{}clear();location.reload()};$('refreshBtn').onclick=refreshAll;$('search').oninput=renderPlayers;
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=async()=>{const p=b.dataset.phase;if(!confirm('Change phase to '+p.replaceAll('_',' ').toUpperCase()+'?'))return;try{await rpc('control_set_phase',{p_phase:p});await refreshAll()}catch(e){msg(e.message)}});document.querySelectorAll('[data-min]').forEach(b=>b.onclick=async()=>{try{await rpc('control_start_timer',{p_minutes:Number(b.dataset.min)});msg('Timer started: '+b.dataset.min+' minutes.',true)}catch(e){msg(e.message)}});$('startReveal').onclick=async()=>{try{await rpc('control_start_vote_reveal');msg('Vote reveal sequence started.',true)}catch(e){msg(e.message)}};$('callNext').onclick=async()=>{try{await rpc('control_call_next_voter');msg('Next voter called.',true)}catch(e){msg(e.message)}};$('showTally').onclick=async()=>{try{const t=await rpc('control_revealed_tally');$('tally').innerHTML=(t.rows||[]).map(r=>`${esc(r.player_name)}: <b>${r.votes}</b>`).join('<br>')||'No revealed votes yet.'}catch(e){msg(e.message)}};
boot();
</script></body></html>
