<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traitors">
<link rel="manifest" href="manifest.webmanifest">
<title>Traitors Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#05070a;--panel:#0b1118;--line:#1b2a38;--text:#eef6ff;--muted:#7890a4;--blue:#2b74ff;--red:#ff2946;--green:#28e07b;--gold:#d9ab4a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#111f31,#05070a 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}.hidden{display:none!important}.app{max-width:680px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.brand{text-align:center;padding:46px 12px 24px}.eye{font-size:52px;filter:drop-shadow(0 0 18px #2b74ff66)}h1{font-size:34px;letter-spacing:5px;margin:4px 0}.sub{font-size:11px;letter-spacing:4px;color:var(--muted)}.card{background:linear-gradient(180deg,#0c131c,#080c11);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 15px 45px #0008}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}button,input{font:inherit}button{border:1px solid #273849;background:#0b141d;color:#fff;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}.tab.on{border-color:var(--blue);box-shadow:0 0 18px #2b74ff33}.primary{width:100%;background:linear-gradient(180deg,#2b74ff,#1556cf);border-color:#4588ff;padding:14px}.red{background:#3a0b13;border-color:#8d2638}.small{padding:7px 9px;font-size:11px}input{width:100%;background:#061019;color:#fff;border:1px solid #203143;border-radius:11px;padding:13px 14px;outline:none;margin:6px 0}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:8px 0}.error{color:#ff8090;text-align:center;padding:9px}.ok{color:#79f0ad;text-align:center;padding:9px}.top{position:sticky;top:0;z-index:20;background:#05070aee;backdrop-filter:blur(14px);border-bottom:1px solid #16212d;padding:10px 0}.row{display:flex;align-items:center;gap:8px}.identity{flex:1;min-width:0}.identity b{font-size:14px}.identity span{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{border:1px solid #224f87;border-radius:999px;padding:6px 9px;font-size:11px;color:#71a9ff}.shield{border-color:#6b5527;color:#f1c558}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0}.nav button{font-size:10px;padding:9px 3px}.chat{padding-bottom:86px}.msg{display:flex;gap:9px;margin:10px 0}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:#101e2b;border:1px solid #263b4e;font-weight:900}.bubble{flex:1;min-width:0}.meta{display:flex;gap:7px;align-items:center;margin-bottom:3px}.name{font-weight:900;font-size:12px}.time{font-size:10px;color:#617689}.body{background:#09121a;border:1px solid #162635;border-radius:5px 13px 13px 13px;padding:10px 11px;overflow-wrap:anywhere}.receipt{color:#60798f;font-size:10px;margin-top:3px}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#05070af2;border-top:1px solid #172331;display:flex;gap:7px;z-index:25}.composer input{margin:0}.composer button{width:48px;background:#143d77;border-color:#2b74ff}.sheet{position:fixed;inset:0;z-index:50;background:#020407dd;display:flex;align-items:flex-end}.sheetbox{width:min(680px,100%);max-height:88vh;overflow:auto;margin:auto;background:#080d13;border:1px solid #25384b;border-radius:20px 20px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}.sheethead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:#080d13;padding:14px 0 10px}.sheethead h2{font-size:15px;letter-spacing:2px;margin:0}.listrow{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid #151f2a}.grow{flex:1;min-width:0}.listrow small{display:block;color:var(--muted)}.online{color:var(--green)}.offline{color:#ff6377}.vote{background:radial-gradient(circle at top,#52101c,#150408 48%,#050204);min-height:70vh}.voteTitle{text-align:center;font-size:24px;font-weight:950;letter-spacing:4px}.count{font-size:24px;font-weight:950;color:#ff4962}.eliminated{text-align:center;padding:80px 20px}.x{font-size:78px;color:var(--red);font-weight:950}@media(max-width:390px){h1{font-size:29px}.brand{padding-top:32px}}
</style>
</head>
<body>
<div class="app">
<section id="authView"><div class="brand"><div class="eye">◉</div><h1>TRAITORS</h1><div class="sub">NIGHT // PROTOCOL</div></div><div class="card"><div class="tabs"><button id="loginTab" class="tab on">LOGIN</button><button id="activateTab" class="tab">FIRST ACTIVATION</button></div><div id="loginForm"><input id="loginStudent" placeholder="Student ID e.g. BB-30955" autocomplete="username"><input id="loginPassword" type="password" placeholder="Your Password" autocomplete="current-password"><button id="loginBtn" class="primary">ENTER LOBBY</button><div class="hint">Already activated? Use Student ID and the password you created.</div></div><div id="activateForm" class="hidden"><input id="actStudent" placeholder="Student ID"><input id="actRoll" placeholder="Roll Number"><input id="actPassword" type="password" placeholder="Create Password (minimum 8 characters)" autocomplete="new-password"><input id="actConfirm" type="password" placeholder="Confirm Password" autocomplete="new-password"><button id="activateBtn" class="primary">CREATE PASSWORD & ENTER</button><div class="hint">First time only. Your password is stored securely in Supabase Auth.</div></div><div id="authMsg"></div></div></section>
<section id="gameView" class="hidden"><div class="top"><div class="row"><div class="identity"><b id="myName">PLAYER</b><span id="myClass">—</span></div><span id="rolePill" class="pill">INNOCENT</span><span id="shieldPill" class="pill shield">🛡 0</span><button id="logoutBtn" class="small">EXIT</button></div><div class="nav"><button id="playersBtn">PLAYERS</button><button id="privateBtn">PRIVATE</button><button id="missionsBtn">MISSIONS</button><button id="voteBtn">VOTE</button></div><div id="traitorBar" class="hidden"><button id="blackRoomBtn" class="red small">ENTER BLACK ROOM</button></div></div><div id="chatTitle" class="hint">MAIN LOBBY • <span id="onlineCount">0</span> online</div><div id="messages" class="chat"></div><div class="composer"><input id="messageInput" maxlength="1200" placeholder="Message…"><button id="sendBtn">➤</button></div></section>
<section id="eliminatedView" class="hidden eliminated"><div class="x">✕</div><h2>YOU HAVE BEEN ELIMINATED</h2><p class="hint">Game access is locked.</p><button id="identityRevealBtn" class="red hidden">REVEAL MY IDENTITY</button><div id="identityResult"></div><br><button id="elimLogout">EXIT</button></section>
</div>
<div id="sheet" class="sheet hidden"><div class="sheetbox"><div class="sheethead"><h2 id="sheetTitle">PANEL</h2><button id="closeSheet">CLOSE</button></div><div id="sheetBody"></div></div></div>
<script>
const URL='https://hqzsmfeckjoxhoktpdyy.supabase.co';
const KEY='sb_publishable_NPBxELB7s_5Mt4pB-aBflw_UgL80P-b';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);let state=null,scope='lobby',privateId=null,timer=null,cover=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function authMsg(t,ok=false){$('authMsg').className=ok?'ok':'error';$('authMsg').textContent=t||''}
function setTab(a){$('loginTab').classList.toggle('on',!a);$('activateTab').classList.toggle('on',a);$('loginForm').classList.toggle('hidden',a);$('activateForm').classList.toggle('hidden',!a);authMsg('')}
$('loginTab').onclick=()=>setTab(false);$('activateTab').onclick=()=>setTab(true);
async function edge(name,body){const r=await fetch(URL+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function rpc(name,args={}){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
$('activateBtn').onclick=async()=>{const sid=$('actStudent').value.trim(),roll=$('actRoll').value.trim(),pw=$('actPassword').value,cf=$('actConfirm').value;if(!sid||!roll)return authMsg('Enter Student ID and Roll Number.');if(pw.length<8)return authMsg('Password must be at least 8 characters.');if(pw!==cf)return authMsg('Passwords do not match.');try{$('activateBtn').disabled=true;authMsg('Creating account…',true);const d=await edge('activate-student',{student_id:sid,roll_number:roll,password:pw});const {error}=await sb.auth.signInWithPassword({email:d.login_email,password:pw});if(error)throw error;await boot()}catch(e){authMsg(e.message||'Activation failed.')}finally{$('activateBtn').disabled=false}};
$('loginBtn').onclick=async()=>{const sid=$('loginStudent').value.trim(),pw=$('loginPassword').value;if(!sid||!pw)return authMsg('Enter Student ID and password.');try{$('loginBtn').disabled=true;authMsg('Checking account…',true);const d=await edge('resolve-login',{student_id:sid});const {error}=await sb.auth.signInWithPassword({email:d.login_email,password:pw});if(error)throw error;await boot()}catch(e){authMsg('Login failed. If this is your first time, use FIRST ACTIVATION.')}finally{$('loginBtn').disabled=false}};
async function logout(){clearInterval(timer);await sb.auth.signOut();location.reload()}$('logoutBtn').onclick=logout;$('elimLogout').onclick=logout;
function roleVisual(){const t=state?.role==='traitor';$('rolePill').textContent=t&&!cover?'TRAITOR':'INNOCENT';$('rolePill').style.color=t&&!cover?'#ff7082':'#71a9ff';$('rolePill').style.borderColor=t&&!cover?'#7b2232':'#224f87';$('traitorBar').classList.toggle('hidden',!(t&&!cover&&state.traitor_room_open))}
$('rolePill').ondblclick=()=>{if(state?.role==='traitor'){cover=!cover;roleVisual()}};
async function boot(){const session=(await sb.auth.getSession()).data.session;if(!session){$('authView').classList.remove('hidden');return}try{state=await rpc('get_my_state');$('authView').classList.add('hidden');if(state.status==='eliminated'||state.status==='blocked'){$('gameView').classList.add('hidden');$('eliminatedView').classList.remove('hidden');if(state.reveal_requested)$('identityRevealBtn').classList.remove('hidden');return}$('eliminatedView').classList.add('hidden');$('gameView').classList.remove('hidden');$('myName').textContent=state.player_name;$('myClass').textContent=state.class_name;$('shieldPill').textContent='🛡 '+(state.shields||0);roleVisual();await refresh();clearInterval(timer);timer=setInterval(refresh,5000)}catch(e){authMsg('Game access error: '+e.message);$('authView').classList.remove('hidden');$('gameView').classList.add('hidden')}}
async function refresh(){try{state=await rpc('get_my_state');if(state.status!=='active')return boot();await rpc('student_presence_heartbeat');const p=await rpc('student_list_lobby_players');$('onlineCount').textContent=p.filter(x=>x.online).length;await loadMessages()}catch(e){console.log(e)}}
async function loadMessages(){const rows=await rpc('student_get_messages',{p_scope:scope,p_private_lobby_id:privateId});$('messages').innerHTML=rows.map(m=>`<div class="msg"><div class="avatar">${esc(m.sender_initials||'?')}</div><div class="bubble"><div class="meta"><span class="name">${esc(m.sender_label)}</span><span class="time">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="body">${esc(m.body)}</div><div class="receipt">✓✓ Viewed by ${m.view_count}</div></div></div>`).join('');const unread=rows.filter(x=>!x.read_by_me).map(x=>x.message_id);if(unread.length)await rpc('student_mark_messages_read',{p_message_ids:unread})}
async function send(){const t=$('messageInput').value.trim();if(!t)return;$('messageInput').value='';try{await rpc('student_send_message',{p_scope:scope,p_private_lobby_id:privateId,p_body:t});await loadMessages()}catch(e){alert(e.message)}}$('sendBtn').onclick=send;$('messageInput').onkeydown=e=>{if(e.key==='Enter')send()};
function show(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.remove('hidden')}function hide(){$('sheet').classList.add('hidden')}$('closeSheet').onclick=hide;
$('playersBtn').onclick=async()=>{try{const p=await rpc('student_list_lobby_players');show('PLAYERS',p.map(x=>`<div class="listrow"><div class="avatar">${esc(x.initials)}</div><div class="grow"><b>${esc(x.player_name)}</b><small><span class="${x.online?'online':'offline'}">●</span> ${x.online?'Online':'Last seen '+x.last_seen_text} • 🛡 ${x.shields}${x.status==='eliminated'?' • ❌ ELIMINATED':''}</small></div></div>`).join(''))}catch(e){alert(e.message)}};
$('privateBtn').onclick=privatePanel;async function privatePanel(){try{const r=await rpc('student_list_private_lobbies');let h='<div class="card"><b>CREATE PRIVATE LOBBY</b><input id="newRoom" placeholder="Lobby name"><button onclick="createRoom()">CREATE & GET KEY</button></div><div class="card"><b>JOIN WITH KEY</b><input id="joinKey" placeholder="Invite key"><button onclick="joinRoom()">JOIN</button></div>';h+=r.map(x=>`<div class="listrow"><div class="grow"><b>${esc(x.title)}</b><small>Key: ${esc(x.invite_key)}${x.is_owner?' • OWNER':''}</small></div><button onclick="openRoom('${x.lobby_id}','${encodeURIComponent(x.title)}')">OPEN</button></div>`).join('');show('PRIVATE LOBBIES',h)}catch(e){alert(e.message)}}
window.createRoom=async()=>{try{const d=await rpc('student_create_private_lobby',{p_title:$('newRoom').value});alert('Invite key: '+d.invite_key);privatePanel()}catch(e){alert(e.message)}};window.joinRoom=async()=>{try{await rpc('student_join_private_lobby',{p_invite_key:$('joinKey').value});privatePanel()}catch(e){alert(e.message)}};window.openRoom=async(id,title)=>{scope='private';privateId=id;$('chatTitle').textContent='PRIVATE // '+decodeURIComponent(title);hide();await loadMessages()};
$('missionsBtn').onclick=()=>show('MISSIONS','<div class="card"><b>MISSION CONTROL</b><p class="hint">Photo Hunt, Speed Round, Puzzle, Secret Task and Quick Poll will appear here when launched by Admin/Game Master.</p></div>');
$('voteBtn').onclick=openVote;async function openVote(){try{state=await rpc('get_my_state');if(!state.vote_open)return show('VOTING','<p class="hint">No voting round is open right now.</p>');const l=await rpc('student_get_locked_vote');let h='<div class="vote"><div class="voteTitle">'+(state.vote_mode==='murder'?'MURDER // VOTE':'CIRCLE // DOUBT')+'</div><p class="error">LOCK YOUR VOTE. IT CANNOT BE CHANGED.</p>';if(!l.locked){const t=await rpc('student_list_vote_targets');h+=t.map(x=>`<div class="card row"><div class="avatar">${esc(x.initials)}</div><div class="grow"><b>${esc(x.player_name)}</b></div><button class="red" onclick="lockVote('${x.member_id}')">LOCK</button></div>`).join('')}else{h+=`<div class="card" style="text-align:center"><b>YOUR VOTE IS LOCKED</b><h2 style="color:#ff4962">${esc(l.target_name)}</h2>${l.revealed?'<div class="ok">Vote revealed.</div>':l.called_to_reveal?'<button class="primary red" onclick="revealVote()">REVEAL MY VOTE</button>':'<p class="hint">Waiting for Game Master to call your reveal.</p>'}</div>`}const t=await rpc('student_vote_tally');if(t.reveal_started){h+='<h3>LIVE REVEALED VOTES</h3>'+(t.rows||[]).map(x=>`<div class="listrow"><div class="grow">${esc(x.player_name)}</div><div class="count">${x.votes}</div></div>`).join('')+`<p class="hint">${t.revealed_count} of ${t.total_locked} votes revealed.</p>`}h+='</div>';show('VOTE PROTOCOL',h)}catch(e){alert(e.message)}}window.lockVote=async id=>{if(!confirm('Lock this vote?'))return;try{await rpc('student_lock_vote',{p_target_member_id:id});openVote()}catch(e){alert(e.message)}};window.revealVote=async()=>{try{await rpc('student_reveal_vote');openVote()}catch(e){alert(e.message)}};
$('blackRoomBtn').onclick=async()=>{scope='traitor';privateId=null;$('chatTitle').textContent='BLACK ROOM // ANONYMOUS';await loadMessages()};
$('identityRevealBtn').onclick=async()=>{try{const d=await rpc('student_reveal_identity');$('identityResult').innerHTML='<h2 class="'+(d.role==='traitor'?'error':'ok')+'">YOU WERE '+String(d.role).toUpperCase()+'</h2>';$('identityRevealBtn').classList.add('hidden')}catch(e){alert(e.message)}};
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload()});boot();
</script>
</body></html>
